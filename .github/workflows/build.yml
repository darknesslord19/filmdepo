name: Build generated CS3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :tavsiyefilmizlenetProvider:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: generated-cs3
          path: tavsiyefilmizlenetProvider/build/outputs/**
