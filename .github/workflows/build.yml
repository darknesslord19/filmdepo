name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Eklentiyi derle (.cs3 ve plugins.json)
        run: gradle make makePluginsJson --no-daemon

      - name: Ciktilari topla
        run: |
          mkdir -p out
          cp */build/*.cs3 out/
          cp build/plugins.json out/ || true

      - name: Indirilebilir dosya olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: cs3-ciktilari
          path: out/*
